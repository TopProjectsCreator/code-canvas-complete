name: Scheduled OpenCode Review

on:
  schedule:
    # Runs every day at 02:20 AM UTC to beat the midnight API rate-limit rush
    - cron: '31 18 * * *'
  # Allows you to test and trigger the action manually from the Actions tab
  workflow_dispatch:

jobs:
  opencode-review:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      issues: write  # Required so OpenCode can create an issue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode Scanner
        uses: anomalyco/opencode/github@latest
        env:
          # Replace with your actual LLM API key set in Repo Settings -> Secrets
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: anthropic/claude-sonnet-4-20250514
          # Pass the workflow token so OpenCode can interact with the GitHub API
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Inspect the repository for potential bugs, security vulnerabilities, edge-case failures, or severe performance issues.
            
            If you find a high-priority problem:
            1. Create a new GitHub Issue titled "🔍 [OpenCode Scan] Potential issue detected in <module/file>".
            2. Provide a clear explanation of the issue, affected file path(s), line numbers, and a suggested fix.
            
            If no high-priority issues are found, do not create an issue.
