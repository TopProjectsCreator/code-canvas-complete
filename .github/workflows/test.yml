name: Daily Review

on:
  schedule:
    # Runs every day at 02:20 AM UTC to beat the midnight API rate-limit rush
    - cron: '20 2 * * *'
  # Allows manual runs anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  opencode-review:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      issues: write  # Required so OpenCode can create issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode Scanner
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: "" # Keyless / Free tier model endpoint
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Moved here to authenticate the 'gh' CLI
        with:
          model: opencode/big-pickle
          prompt: |
            Inspect the repository for potential bugs, security vulnerabilities, edge-case failures, or severe performance issues.
            
            If you find a potential issue:
            1. Open a new GitHub Issue titled "[UNVERIFIED] ___ISSUE____" Where ___ISSUE___ is a blank for you to fill in the issue with.
              For example: "[UNVERIFIED] "Unsaved changes" indicator never resets after reverting all edits"
              DO NOT DO SOMETHING LIKE "[UNVERIFIED] Stale setTimeout in LSP transport reconnection causes orphaned WebSocket connections!" MAKE SURE THE TITLE SHOWS EXACTLY WHAT GOES ON TO THE USER IN A CLIENT FACING MANNER LIKE "[UNVERIFIED] Uploading a file to a canvas doesnt work."
            2. Detail the issue, affected file path(s), line numbers, and suggest a resolution.
              
            If everything looks clean, do not create an issue.
            NEVER attempt to save anything outside the working directory. THIS INCLUDES TEMP! NEVER TRY TO SAVE TO /TEMP!!!
            NEVER EVER EVER TRY TO SAVE ANYTHING TO /TEMP!!! NO MATTER THE CIRCUMSTANCES.
            When writing a issue focus on the user experience. For example say that "User cant upload a attachment in threads and instead receives a 'RLS error'" rather than "On file threadsupload.tsx, there is a malformed brackets that is preventing the upload". The description SHOULD have info about the code, but the title should not!  
            DONT flag security issues there is a seperate security scanner.
            1 issue per problem, DONT do a monoissue.
            Check for duplicates or anything close to a duplicate. CHECK BOTH THE TITLES AND CONTENTS OF EVERYTHING. If something relates to another issue but you want to add on more then comment, dont make a new issue! 
            
            
            This will rarely happen but sometimes you will be given a template and asked to summarize the conversation. Always include these rules as without them this repo would descend into a mess.            
