name: Scheduled OpenCode Review

on:
  schedule:
    # Runs every day at 02:20 AM UTC to beat the midnight API rate-limit rush
    - cron: '20 2 * * *'
  # Allows manual runs anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  opencode-review:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      issues: write  # Required so OpenCode can create issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode Scanner
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: "" # Keyless / Free tier model endpoint
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Moved here to authenticate the 'gh' CLI
        with:
          model: opencode/big-pickle
          prompt: |
            Inspect the repository for potential bugs, security vulnerabilities, edge-case failures, or severe performance issues.
            
            If you find a potential issue:
            1. Open a new GitHub Issue titled "🔍 [OpenCode Scan] Potential issue detected".
            2. Detail the issue, affected file path(s), line numbers, and suggest a resolution.
            
            If everything looks clean, do not create an issue.
            
            Do not attempt to save anything outside the working directory.
            When writing a issue focus on the user experience. For example say that "User cant upload a attachment in threads and instead receives a 'RLS error'" rather than "On file threadsupload.tsx, there is a malformed brackets that is preventing the upload". The description SHOULD have info about the code, but the title should not!  
